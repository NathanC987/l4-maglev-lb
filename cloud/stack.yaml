AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  l4-maglev-lb on real hosts: one client, the Maglev LB, backends and a monitoring
  host in a single subnet, with Direct Server Return over GRE. Free-tier sized; see
  docs/cloud.md. Create and delete it with cloud/up.sh and cloud/down.sh.

# Fixed private addresses keep the LB's --backend list, the Prometheus config and
# the flow-log analysis static. The LB and every backend MUST share a subnet:
# maglev-lb ARPs each backend's IP directly (it has no next-hop gateway support),
# and the VPC answers ARP only for addresses in the same subnet.
#
#   client 10.99.1.10   client2 10.99.1.11 (canvas)   lb 10.99.1.20
#   be1..be5 10.99.1.31..35   mon 10.99.1.40
#   VIP    10.200.0.10  (outside the VPC CIDR, routed to the LB by the route table)

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH to every instance.
  AdminCidr:
    Type: String
    Description: The only source allowed to SSH in (your public IP as a.b.c.d/32).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  AdminCidr2:
    Type: String
    Default: ""
    Description: >-
      A second SSH source, for networks that send traffic out through two public
      IPs (common on campus and office NATs). Empty for none.
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  Profile:
    Type: String
    Default: full
    AllowedValues: [minimal, full, canvas]
    Description: >-
      minimal = client + lb + be1 (bring-up checks); full = adds be2..be4 and mon;
      canvas = client, client2, lb, be1..be5, started and stopped from the live
      canvas (see cloud/canvas.sh). 8 instances of 2 vCPUs: the 16-vCPU quota exactly.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro, c7i-flex.large, m7i-flex.large]
    Description: >-
      The backends and mon. Use a type your account's free tier covers: t3.micro /
      c7i-flex.large on the Free plan (accounts created after 2025-07-15), t2.micro
      on most legacy 12-month free-tier accounts. See docs/cloud.md.
  MeasuredInstanceType:
    Type: String
    Default: c7i-flex.large
    AllowedValues: [t3.micro, t3.small, t2.micro, c7i-flex.large, m7i-flex.large]
    Description: >-
      The lb and the client, the two hosts the benchmarks measure. A T3 in standard
      credit mode starts with no CPU credits and earns 12 an hour, so under load it
      is soon throttled to its baseline; c7i-flex.large has no credits to run out of.
  CpuCredits:
    Type: String
    Default: standard
    AllowedValues: [standard, unlimited]
    Description: >-
      For burstable instances. standard throttles to the baseline when out of credits
      and never costs extra. unlimited keeps full speed and bills CPU above the
      baseline at $0.05 per vCPU-hour (from the credits on the Free plan).
  FlowLogs:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: >-
      VPC Flow Logs into CloudWatch Logs. Leave on for the streaming demo and the
      DSR proof; turn off for high-rate request/response sweeps (every short
      connection becomes a log record).
  AutoTerminateMinutes:
    Type: Number
    Default: 240
    MinValue: 30
    MaxValue: 720
    Description: >-
      Dead-man switch. Every instance terminates itself this long after booting; on
      the canvas profile it stops instead, and the switch re-arms on every start.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS (x86_64), resolved from Canonical's public SSM parameter.

Conditions:
  IsFull: !Equals [!Ref Profile, full]
  IsCanvas: !Equals [!Ref Profile, canvas]
  HasBe2To4: !Or [{Condition: IsFull}, {Condition: IsCanvas}]
  FlowLogsOn: !Equals [!Ref FlowLogs, "on"]
  HasAdminCidr2: !Not [!Equals [!Ref AdminCidr2, ""]]
  # CreditSpecification is only valid on burstable families.
  IsBurstable: !Or
    - !Equals [!Select [0, !Split [".", !Ref InstanceType]], t2]
    - !Equals [!Select [0, !Split [".", !Ref InstanceType]], t3]
  ClientIsBurstable: !Or
    - !And [{Condition: IsCanvas}, {Condition: IsBurstable}]
    - !And [!Not [{Condition: IsCanvas}], {Condition: MeasuredIsBurstable}]
  MeasuredIsBurstable: !Or
    - !Equals [!Select [0, !Split [".", !Ref MeasuredInstanceType]], t2]
    - !Equals [!Select [0, !Split [".", !Ref MeasuredInstanceType]], t3]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-igw"}]

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.99.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-subnet"}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-rt"}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  # The VIP is not an address any instance owns. This route is what makes the
  # client's packets for it arrive at the LB at all (the cloud's equivalent of the
  # local topology's "ip route add VIP via LB" on the client).
  VipRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 10.200.0.10/32
      InstanceId: !Ref LbInstance

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: l4-maglev-lb hosts
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr,
           Description: SSH from the operator only}
        - !If
          - HasAdminCidr2
          - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr2,
             Description: SSH from the operator's second public IP}
          - !Ref AWS::NoValue
        # Everything inside the VPC, which includes GRE (IP protocol 47) from the
        # LB to the backends, health checks, and Prometheus scrapes.
        - {IpProtocol: "-1", CidrIp: 10.99.0.0/16, Description: all traffic within the VPC}
        # DSR replies leave the backends with the VIP as their source address.
        - {IpProtocol: "-1", CidrIp: 10.200.0.10/32, Description: DSR replies from the VIP}
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-sg"}]

  # ---- CloudWatch: the independent referee -----------------------------------
  # The log group always exists (an empty one costs nothing), so the dashboard and
  # cloud/dsr-proof.sh never point at a missing group; only the FlowLog toggles.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/vpc-flow-logs"
      RetentionInDays: 1

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: FlowLogsOn
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deliver-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups,
                         logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn

  # pkt-srcaddr is the field that matters: for traffic leaving an interface,
  # srcaddr is always that interface's own address, while pkt-srcaddr is the
  # source written in the packet - the VIP, for a backend's DSR replies.
  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: FlowLogsOn
    Properties:
      ResourceType: Subnet
      ResourceId: !Ref Subnet
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      LogFormat: >-
        ${version} ${interface-id} ${instance-id} ${flow-direction} ${srcaddr} ${dstaddr}
        ${pkt-srcaddr} ${pkt-dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes}
        ${start} ${end} ${action} ${log-status}

  # Grafana on mon reads CloudWatch with this role, so no AWS keys live anywhere.
  MonRole:
    Type: AWS::IAM::Role
    Condition: IsFull
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-cloudwatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cloudwatch:GetMetricData, cloudwatch:GetMetricStatistics,
                         cloudwatch:ListMetrics, ec2:DescribeInstances, ec2:DescribeRegions,
                         ec2:DescribeTags, logs:DescribeLogGroups, tag:GetResources]
                Resource: "*"
              - Effect: Allow
                Action: [logs:StartQuery, logs:GetQueryResults, logs:StopQuery,
                         logs:GetLogGroupFields, logs:GetLogEvents]
                Resource: [!GetAtt FlowLogGroup.Arn, !Sub "${FlowLogGroup.Arn}:*"]
              - Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery]
                Resource: "*"

  MonInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: IsFull
    Properties:
      Roles: [!Ref MonRole]

  # The LB instance's own role: Session Manager only, so the AWS console can open
  # a terminal on it (EC2 -> the lb instance -> Connect -> Session Manager) and run
  # maglev-view, with no SSH port opened. AWS's managed policy lets the instance's
  # SSM agent register and carry sessions; it reads or changes nothing else.
  LbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

  LbInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref LbRole]

  # What the live canvas's bridge runs as: it may start and stop this stack's
  # instances, read their state and read CloudWatch metrics (for the Grafana
  # dashboard), and nothing else. It cannot launch an instance,
  # so the pool in this template is a hard limit on how much a bug could spend.
  CanvasOperatorRole:
    Type: AWS::IAM::Role
    Condition: IsCanvas
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-stop-this-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals: {"ec2:ResourceTag/l4mlb-canvas": !Ref AWS::StackName}
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              # Read-only, for cloud/canvas.sh grafana (bridge/cloudwatch.py). It takes
              # no resource or condition, so it covers any metric in this account.
              - Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: "*"

  # ---- Instances --------------------------------------------------------------
  # User data is kept tiny on purpose: it only records the role and arms the
  # dead-man switch. Packages and the code are installed by cloud/deploy.sh over
  # SSH, so a fix never needs the instances recreated. User data runs only on the
  # first boot, so a per-boot script re-arms the switch after a stop and start.
  ClientInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !If [IsCanvas, !Ref InstanceType, !Ref MeasuredInstanceType]
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [ClientIsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.10,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo client > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-client"}
        - {Key: l4mlb-role, Value: client}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  # The canvas's second client: each canvas client is its own instance.
  Client2Instance:
    Type: AWS::EC2::Instance
    Condition: IsCanvas
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !If [IsCanvas, !Ref InstanceType, !Ref MeasuredInstanceType]
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [ClientIsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.11,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo client2 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-client2"}
        - {Key: l4mlb-role, Value: client2}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  LbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref MeasuredInstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref LbInstanceProfile
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [MeasuredIsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      # It receives packets addressed to the VIP, which is not its own address.
      SourceDestCheck: false
      # 1-minute EC2 metrics on the LB only: 7 metrics, inside the free 10.
      Monitoring: true
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.20,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo lb > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-lb"}
        - {Key: l4mlb-role, Value: lb}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  # Backends send DSR replies with the VIP as the source address, which the VPC
  # drops unless source/destination checking is off.
  Be1Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.31,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be1 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-be1"}
        - {Key: l4mlb-role, Value: be1}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  Be2Instance:
    Type: AWS::EC2::Instance
    Condition: HasBe2To4
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.32,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be2 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-be2"}
        - {Key: l4mlb-role, Value: be2}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  Be3Instance:
    Type: AWS::EC2::Instance
    Condition: HasBe2To4
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.33,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be3 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-be3"}
        - {Key: l4mlb-role, Value: be3}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  # Dormant at the start of the demo: the scale-out scene starts its responder.
  Be4Instance:
    Type: AWS::EC2::Instance
    Condition: HasBe2To4
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.34,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be4 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-be4"}
        - {Key: l4mlb-role, Value: be4}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  Be5Instance:
    Type: AWS::EC2::Instance
    Condition: IsCanvas
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: !If [IsCanvas, stop, terminate]
      MetadataOptions: {HttpTokens: required}
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.35,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be5 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
          printf '#!/bin/sh\nshutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-stop"\n' >/var/lib/cloud/scripts/per-boot/l4mlb-deadman
          chmod 755 /var/lib/cloud/scripts/per-boot/l4mlb-deadman
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-be5"}
        - {Key: l4mlb-role, Value: be5}
        - !If [IsCanvas, {Key: l4mlb-canvas, Value: !Ref AWS::StackName}, !Ref AWS::NoValue]

  MonInstance:
    Type: AWS::EC2::Instance
    Condition: IsFull
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref MonInstanceProfile
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: !Ref CpuCredits}, !Ref AWS::NoValue]
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.40,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo mon > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-mon"}, {Key: l4mlb-role, Value: mon}]

Outputs:
  Region: {Value: !Ref AWS::Region}
  Profile: {Value: !Ref Profile}
  Vip: {Value: 10.200.0.10}
  FlowLogGroup: {Value: !Ref FlowLogGroup}
  ClientInstanceId: {Value: !Ref ClientInstance}
  Client2InstanceId: {Condition: IsCanvas, Value: !Ref Client2Instance}
  LbInstanceId: {Value: !Ref LbInstance}
  Be1InstanceId: {Value: !Ref Be1Instance}
  Be2InstanceId: {Condition: HasBe2To4, Value: !Ref Be2Instance}
  Be3InstanceId: {Condition: HasBe2To4, Value: !Ref Be3Instance}
  Be4InstanceId: {Condition: HasBe2To4, Value: !Ref Be4Instance}
  Be5InstanceId: {Condition: IsCanvas, Value: !Ref Be5Instance}
  CanvasOperatorRoleArn: {Condition: IsCanvas, Value: !GetAtt CanvasOperatorRole.Arn}
  MonInstanceId: {Condition: IsFull, Value: !Ref MonInstance}
