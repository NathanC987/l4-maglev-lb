AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  l4-maglev-lb on real hosts: one client, the Maglev LB, backends and a monitoring
  host in a single subnet, with Direct Server Return over GRE. Free-tier sized; see
  docs/cloud.md. Create and delete it with cloud/up.sh and cloud/down.sh.

# Fixed private addresses keep the LB's --backend list, the Prometheus config and
# the flow-log analysis static. The LB and every backend MUST share a subnet:
# maglev-lb ARPs each backend's IP directly (it has no next-hop gateway support),
# and the VPC answers ARP only for addresses in the same subnet.
#
#   client 10.99.1.10   lb 10.99.1.20   be1..be4 10.99.1.31..34   mon 10.99.1.40
#   VIP    10.200.0.10  (outside the VPC CIDR, routed to the LB by the route table)

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH to every instance.
  AdminCidr:
    Type: String
    Description: The only source allowed to SSH in (your public IP as a.b.c.d/32).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  Profile:
    Type: String
    Default: full
    AllowedValues: [minimal, full]
    Description: >-
      minimal = client + lb + be1 (bring-up checks); full = adds be2..be4 and mon.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro, c7i-flex.large, m7i-flex.large]
    Description: >-
      Use a type your account's free tier covers: t3.micro / c7i-flex.large on the
      Free plan (accounts created after 2025-07-15), t2.micro on most legacy
      12-month free-tier accounts. See docs/cloud.md.
  FlowLogs:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
    Description: >-
      VPC Flow Logs into CloudWatch Logs. Leave on for the streaming demo and the
      DSR proof; turn off for high-rate request/response sweeps (every short
      connection becomes a log record).
  AutoTerminateMinutes:
    Type: Number
    Default: 240
    MinValue: 30
    MaxValue: 720
    Description: Dead-man switch. Every instance terminates itself after this long.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS (x86_64), resolved from Canonical's public SSM parameter.

Conditions:
  IsFull: !Equals [!Ref Profile, full]
  FlowLogsOn: !Equals [!Ref FlowLogs, "on"]
  # CreditSpecification is only valid on burstable families. "standard" means the
  # instance is throttled to its baseline when out of credits instead of billing
  # for surplus CPU, which T3's default ("unlimited") would do.
  IsBurstable: !Or
    - !Equals [!Select [0, !Split [".", !Ref InstanceType]], t2]
    - !Equals [!Select [0, !Split [".", !Ref InstanceType]], t3]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-igw"}]

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.99.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-subnet"}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-rt"}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  # The VIP is not an address any instance owns. This route is what makes the
  # client's packets for it arrive at the LB at all (the cloud's equivalent of the
  # local topology's "ip route add VIP via LB" on the client).
  VipRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 10.200.0.10/32
      InstanceId: !Ref LbInstance

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: l4-maglev-lb hosts
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr,
           Description: SSH from the operator only}
        # Everything inside the VPC, which includes GRE (IP protocol 47) from the
        # LB to the backends, health checks, and Prometheus scrapes.
        - {IpProtocol: "-1", CidrIp: 10.99.0.0/16, Description: all traffic within the VPC}
        # DSR replies leave the backends with the VIP as their source address.
        - {IpProtocol: "-1", CidrIp: 10.200.0.10/32, Description: DSR replies from the VIP}
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-sg"}]

  # ---- CloudWatch: the independent referee -----------------------------------
  # The log group always exists (an empty one costs nothing), so the dashboard and
  # cloud/dsr-proof.sh never point at a missing group; only the FlowLog toggles.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/vpc-flow-logs"
      RetentionInDays: 1

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: FlowLogsOn
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deliver-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups,
                         logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn

  # pkt-srcaddr is the field that matters: for traffic leaving an interface,
  # srcaddr is always that interface's own address, while pkt-srcaddr is the
  # source written in the packet - the VIP, for a backend's DSR replies.
  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: FlowLogsOn
    Properties:
      ResourceType: Subnet
      ResourceId: !Ref Subnet
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      LogFormat: >-
        ${version} ${interface-id} ${instance-id} ${flow-direction} ${srcaddr} ${dstaddr}
        ${pkt-srcaddr} ${pkt-dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes}
        ${start} ${end} ${action} ${log-status}

  # Grafana on mon reads CloudWatch with this role, so no AWS keys live anywhere.
  MonRole:
    Type: AWS::IAM::Role
    Condition: IsFull
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-cloudwatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cloudwatch:GetMetricData, cloudwatch:GetMetricStatistics,
                         cloudwatch:ListMetrics, ec2:DescribeInstances, ec2:DescribeRegions,
                         ec2:DescribeTags, logs:DescribeLogGroups, tag:GetResources]
                Resource: "*"
              - Effect: Allow
                Action: [logs:StartQuery, logs:GetQueryResults, logs:StopQuery,
                         logs:GetLogGroupFields, logs:GetLogEvents]
                Resource: [!GetAtt FlowLogGroup.Arn, !Sub "${FlowLogGroup.Arn}:*"]
              - Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery]
                Resource: "*"

  MonInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: IsFull
    Properties:
      Roles: [!Ref MonRole]

  # ---- Instances --------------------------------------------------------------
  # User data is kept tiny on purpose: it only records the role and arms the
  # dead-man switch. Packages and the code are installed by cloud/deploy.sh over
  # SSH, so a fix never needs the instances recreated.
  ClientInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.10,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo client > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-client"}, {Key: l4mlb-role, Value: client}]

  LbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      # It receives packets addressed to the VIP, which is not its own address.
      SourceDestCheck: false
      # 1-minute EC2 metrics on the LB only: 7 metrics, inside the free 10.
      Monitoring: true
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.20,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo lb > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-lb"}, {Key: l4mlb-role, Value: lb}]

  # Backends send DSR replies with the VIP as the source address, which the VPC
  # drops unless source/destination checking is off.
  Be1Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.31,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be1 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-be1"}, {Key: l4mlb-role, Value: be1}]

  Be2Instance:
    Type: AWS::EC2::Instance
    Condition: IsFull
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.32,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be2 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-be2"}, {Key: l4mlb-role, Value: be2}]

  Be3Instance:
    Type: AWS::EC2::Instance
    Condition: IsFull
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.33,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be3 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-be3"}, {Key: l4mlb-role, Value: be3}]

  # Dormant at the start of the demo: the scale-out scene starts its responder.
  Be4Instance:
    Type: AWS::EC2::Instance
    Condition: IsFull
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      SourceDestCheck: false
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.34,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo be4 > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-be4"}, {Key: l4mlb-role, Value: be4}]

  MonInstance:
    Type: AWS::EC2::Instance
    Condition: IsFull
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref MonInstanceProfile
      InstanceInitiatedShutdownBehavior: terminate
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref AWS::NoValue]
      NetworkInterfaces:
        - {DeviceIndex: "0", SubnetId: !Ref Subnet, PrivateIpAddress: 10.99.1.40,
           GroupSet: [!Ref SecurityGroup], AssociatePublicIpAddress: true,
           DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo mon > /etc/l4mlb-role
          shutdown -h +${AutoTerminateMinutes} "l4-maglev-lb auto-terminate"
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-mon"}, {Key: l4mlb-role, Value: mon}]

Outputs:
  Region: {Value: !Ref AWS::Region}
  Profile: {Value: !Ref Profile}
  Vip: {Value: 10.200.0.10}
  FlowLogGroup: {Value: !Ref FlowLogGroup}
  ClientPublicIp: {Value: !GetAtt ClientInstance.PublicIp}
  ClientInstanceId: {Value: !Ref ClientInstance}
  LbPublicIp: {Value: !GetAtt LbInstance.PublicIp}
  LbInstanceId: {Value: !Ref LbInstance}
  Be1PublicIp: {Value: !GetAtt Be1Instance.PublicIp}
  Be1InstanceId: {Value: !Ref Be1Instance}
  Be2PublicIp: {Condition: IsFull, Value: !GetAtt Be2Instance.PublicIp}
  Be2InstanceId: {Condition: IsFull, Value: !Ref Be2Instance}
  Be3PublicIp: {Condition: IsFull, Value: !GetAtt Be3Instance.PublicIp}
  Be3InstanceId: {Condition: IsFull, Value: !Ref Be3Instance}
  Be4PublicIp: {Condition: IsFull, Value: !GetAtt Be4Instance.PublicIp}
  Be4InstanceId: {Condition: IsFull, Value: !Ref Be4Instance}
  MonPublicIp: {Condition: IsFull, Value: !GetAtt MonInstance.PublicIp}
  MonInstanceId: {Condition: IsFull, Value: !Ref MonInstance}
