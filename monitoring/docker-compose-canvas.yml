# Prometheus + Grafana for the live canvas on AWS (cloud/canvas.sh grafana), run on
# the machine that runs the bridge. The canvas profile has no monitoring host (its 8
# instances use the whole 16-vCPU quota), so this runs here instead, scraping the
# bridge's read-only metrics on 127.0.0.1:9109 (bridge/promexport.py), which carry
# the canvas's numbers, each instance's own CPU and network, and CloudWatch's view.
# Both listen on 127.0.0.1 only. Ports differ from docker-compose.yml's (3000/9090)
# so the two can run side by side.
# A fixed project name: Compose otherwise names the project after the directory, and
# a run from another checkout (or with -p) would then trip over these container
# names instead of reusing them.
name: maglev-lb-canvas

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: maglev-lb-prometheus-canvas
    network_mode: host
    volumes:
      - ./prometheus-canvas.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-canvas-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.listen-address=127.0.0.1:9093
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: maglev-lb-grafana-canvas
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3001
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set by cloud/canvas.sh grafana}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/maglev-lb-canvas.json
    volumes:
      - ./grafana-canvas/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-canvas/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-canvas-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-canvas-data:
  grafana-canvas-data:
