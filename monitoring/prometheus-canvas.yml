# The live canvas's bridge (bridge/promexport.py), for cloud/canvas.sh grafana. Every
# 2 s, so the dashboard keeps up with the canvas; the bridge only renders a snapshot
# it already has, so a scrape costs it next to nothing.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

scrape_configs:
  - job_name: canvas-bridge
    static_configs:
      - targets: ["127.0.0.1:9109"]
        labels:
          instance: canvas-bridge
