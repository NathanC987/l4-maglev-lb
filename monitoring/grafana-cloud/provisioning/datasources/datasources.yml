apiVersion: 1

datasources:
  - name: Prometheus (cloud)
    uid: prometheus-cloud
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false

  # AWS's own measurements of the same hosts. authType "default" uses the mon
  # instance's IAM role (cloud/stack.yaml: MonRole), so no keys are stored.
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: $AWS_REGION
